<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>সদস্য তথ্য</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="login"><div class="panel"><h1>সদস্যের তথ্য সম্পাদনা</h1><form method="post" enctype="multipart/form-data"><label>নাম</label><input name="name" value="{{member.name}}" required><label>মোবাইল নম্বর</label><input name="phone" value="{{member.phone}}"><label>ঠিকানা</label><textarea name="address" rows="4">{{member.address}}</textarea><label>মাসিক চাঁদা</label><input type="number" name="monthly" value="{{member.monthly}}" min="0" step="1"><label>ছবি</label><input type="file" name="photo" accept="image/*"><button type="submit">সংরক্ষণ করুন</button></form><a href="/admin">← অ্যাডমিনে ফিরে যান</a></div></main></body></html>
