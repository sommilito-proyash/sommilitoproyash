<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — সম্মিলিত প্রয়াস</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="login"><div class="panel"><h1>সম্মিলিত প্রয়াস</h1><p>Members-only information</p>{% if error %}<div class="error">{{error}}</div>{% endif %}<h2>Member Login</h2><form method="post"><input type="hidden" name="kind" value="member"><label>Email</label><input type="email" name="email" required><label>Password</label><input type="password" name="password" required><button type="submit">Member Login</button></form><hr><h2>Admin Login</h2><form method="post"><input type="hidden" name="kind" value="admin"><label>Admin Password</label><input type="password" name="password" required><button type="submit">Admin Login</button></form></div></main></body></html>
