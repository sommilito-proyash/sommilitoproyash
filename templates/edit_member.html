<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Member</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="login"><div class="panel"><h1>Member Information</h1><form method="post" enctype="multipart/form-data"><input type="hidden" name="year" value="{{request.args.get('year','')}}"><label>Name</label><input name="name" value="{{member.name}}" required><label>Email</label><input type="email" name="email" value="{{member.email or ''}}" required><label>New member password</label><input type="password" name="password" placeholder="Leave blank to keep current password"><label>Mobile</label><input name="phone" value="{{member.phone or ''}}"><label>Address</label><textarea name="address" rows="4">{{member.address or ''}}</textarea><label>Photo</label><input type="file" name="photo" accept="image/*"><button type="submit">Save changes</button></form><a href="/admin?year={{request.args.get('year','')}}">← Back to Admin</a></div></main></body></html>
