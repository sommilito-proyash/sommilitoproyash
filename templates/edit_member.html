<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Member — সম্মিলিত প্রয়াস</title><link rel="stylesheet" href="/static/style.css"></head><body><header><a class="brand" href="/admin"><img src="/static/logo.svg" alt="সম্মিলিত প্রয়াস"></a><nav><a href="/admin">অ্যাডমিন</a><a href="/logout">লগআউট</a></nav></header><main><div class="panel"><h2>সদস্য তথ্য পরিবর্তন</h2><form method="post" enctype="multipart/form-data" class="add-member-form"><label>নাম</label><input name="name" value="{{member.name}}" required><label>Personal Email (ঐচ্ছিক)</label><input type="email" name="personal_email" value="{{member.personal_email or ''}}"><label>Blood Group (ঐচ্ছিক)</label><input name="blood_group" value="{{member.blood_group or ''}}"><label>মোবাইল</label><input name="phone" value="{{member.phone or ''}}"><label>ঠিকানা</label><input name="address" value="{{member.address or ''}}"><label>মাসিক চাঁদা</label><input type="number" name="monthly" value="{{member.monthly}}" min="0" step="1"><label>ছবি</label><input type="file" name="photo" accept="image/*"><button>Save</button></form></div></main></body></html>
